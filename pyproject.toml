[project]
name = "riplex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "0xRakkesh", email = "rakesh904664@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "dotenv>=0.9.9",
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langsmith>=0.14.11",
    "pydantic>=2.14.1",
    "pysbd>=0.3.4",
    "pytest>=9.1.1",
    "sumy>=0.13.0",
    "tavily>=1.1.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
riplex = "riplex:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
